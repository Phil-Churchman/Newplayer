name: NewPlayer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
configs:
  Debug: debug
  Release: release
targets:
  NewPlayer:
    type: application
    platform: iOS
    sources:
      - path: NewPlayer
        excludes:
          - "Resources/Info.plist"
    info:
      path: NewPlayer/Resources/Info.plist
      properties:
        CFBundleDisplayName: New player
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad is used in any orientation, and a split view has the room for landscape.
        UISupportedInterfaceOrientations~ipad: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationPortraitUpsideDown,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight,
        ]
        NSLocalNetworkUsageDescription: New player uses your local network to connect to and control your MPD music server.
        # The Spotify OAuth redirect comes back to this scheme; it must match the redirect URI
        # registered against the client ID in Spotify's dashboard.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.newplayer.spotify
            CFBundleURLSchemes: [newplayer]
        NSAppleMusicUsageDescription: New player reads your Music library so you can browse and play the songs already on this device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.newplayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - NewPlayerTests
        - NewPlayerUITests
      commandLineArguments: []
  NewPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NewPlayerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NewPlayer
  NewPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NewPlayerUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NewPlayer
